spring:
  application:
    name: authserver
  datasource:
    url: jdbc:h2:mem:db
    username: sa
    password: sa
  jpa:
    show-sql: true
  h2:
    console:
      enabled: true
  web:
    error:
      include-binding-errors: always
      include-stacktrace: always
      include-exception: true

logging:
  file:
    path: ./logs